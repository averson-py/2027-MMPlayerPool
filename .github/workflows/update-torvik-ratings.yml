name: Update Torvik ratings

on:
  schedule:
    - cron: "0 11 * * *" # daily, 11:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to run
        id: gate
        run: |
          # Manual runs always go. Scheduled runs: daily Mar 10 - Apr 10, otherwise Mondays only.
          md=$(date -u +%m%d)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || { [ "$md" -ge 0310 ] && [ "$md" -le 0410 ]; } \
             || [ "$(date -u +%u)" = "1" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Download ratings
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install requests
          python torvik_ratings.py

      - name: Commit if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          if git diff --quiet -- assets/torvik_ratings.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/torvik_ratings.json
          git commit -m "Update Torvik ratings"
          git pull --rebase
          git push
